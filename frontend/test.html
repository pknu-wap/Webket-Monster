<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webket-Monster Spritesheet Visualizer</title>
    <script src="https://pixijs.download/v8.1.0/pixi.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: rgba(20, 20, 28, 0.6);
            --primary-color: #7000ff;
            --primary-glow: rgba(112, 0, 255, 0.4);
            --text-color: #f1eff7;
            --success-color: #00e676;
            --error-color: #ff1744;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 230, 118, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(112, 0, 255, 0.2);
            letter-spacing: -0.5px;
        }

        header p {
            margin: 8px 0 0 0;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .main-panel {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .main-panel {
                grid-template-columns: 1fr;
            }
        }

        .glass-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(112, 0, 255, 0.15);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-color);
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-radius: 12px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, #4c0519 100%);
            border-color: var(--primary-color);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .viewer-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
            position: relative;
        }

        #canvas-wrapper {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            background-color: #121214;
            background-image: 
                linear-gradient(45deg, #18181c 25%, transparent 25%), 
                linear-gradient(-45deg, #18181c 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #18181c 75%), 
                linear-gradient(-45deg, transparent 75%, #18181c 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
        }

        #canvas-wrapper.loading {
            border-color: var(--primary-color);
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.success {
            background: rgba(0, 230, 118, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .status-badge.error {
            background: rgba(255, 23, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(255, 23, 68, 0.2);
            text-align: center;
        }

        .status-badge.loading {
            background: rgba(112, 0, 255, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(112, 0, 255, 0.2);
        }

        .log-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #94a3b8;
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-control input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary-color);
            cursor: pointer;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Webket-Monster Spritesheet Visualizer</h1>
            <p>S3에 업로드된 몬스터들의 스프라이트 1번 에셋(4x4 규격)이 로컬에서 자연스럽게 동작하는지 테스트합니다.</p>
        </header>

        <div class="main-panel">
            <!-- Left Side: Controls -->
            <div class="glass-card">
                <div class="form-group">
                    <label for="s3-bucket-input">S3 버킷 경로</label>
                    <input type="text" id="s3-bucket-input" value="https://webket-monster-monster-assets.s3.ap-southeast-2.amazonaws.com">
                </div>

                <div class="form-group">
                    <label for="monster-id-select">몬스터 선택</label>
                    <select id="monster-id-select">
                        <option value="11">ID 11: 크리에이터 (유튜브 2단계)</option>
                        <option value="12">ID 12: 골드버튼 (유튜브 3단계)</option>
                        <option value="13">ID 13: 커밋 (깃허브 1단계)</option>
                        <option value="14">ID 14: 옥토캣 (깃허브 2단계)</option>
                        <option value="15">ID 15: 잔디밭 (깃허브 3단계)</option>
                        <option value="16">ID 16: 일촌신청 (링크드인 1단계)</option>
                        <option value="17">ID 17: 프로직장러 (링크드인 2단계)</option>
                        <option value="18">ID 18: 커리어킹 (링크드인 3단계)</option>
                        <option value="19">ID 19: 작은나무 (나무위키 1단계)</option>
                        <option value="20">ID 20: 기여분 (나무위키 2단계)</option>
                        <option value="1">ID 01: 뿌공이 (부경대 1단계 - 참고용)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>애니메이션 상태 (행 번호)</label>
                    <div class="btn-group">
                        <button class="btn active" onclick="changeState(0, this)">대기 (Idle - 0행)</button>
                        <button class="btn" onclick="changeState(1, this)">걷기 (Walk - 1행)</button>
                        <button class="btn" onclick="changeState(2, this)">기쁨 (Happy - 2행)</button>
                        <button class="btn" onclick="changeState(3, this)">배고픔 (Hungry - 3행)</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fps-range">재생 속도 (FPS)</label>
                    <div class="speed-control">
                        <input type="range" id="fps-range" min="2" max="24" value="4">
                        <span id="fps-val" style="font-weight: 700; width: 30px;">4</span>
                    </div>
                </div>

                <div class="log-panel" id="log-output">
                    시스템 대기 중...
                </div>
            </div>

            <!-- Right Side: Live PixiJS Viewport -->
            <div class="glass-card viewer-panel">
                <div id="canvas-wrapper">
                    <div class="loader-spinner" id="spinner"></div>
                </div>

                <div style="margin-top: 16px; text-align: center;">
                    <div class="status-badge loading" id="status-display">대기 중...</div>
                </div>

                <div style="margin-top: 10px; font-size: 0.85rem; color: #64748b; text-align: center; max-width: 320px;">
                    ※ 이미지가 로드되지 않는 경우 S3 버킷의 CORS 설정(GET 요청 허용)을 확인해 주세요.
                </div>
            </div>
        </div>
    </div>

    <script>
        let app = null;
        let activeSprite = null;
        let idleFrames = [];
        let currentFrames = [];
        
        let selectedStateRow = 0; // 0 = Idle, 1 = Walk, 2 = Happy, 3 = Hungry
        let animationElapsed = 0;
        let currentFps = 4;

        const s3Input = document.getElementById("s3-bucket-input");
        const monsterSelect = document.getElementById("monster-id-select");
        const fpsRange = document.getElementById("fps-range");
        const fpsVal = document.getElementById("fps-val");
        const statusDisplay = document.getElementById("status-display");
        const logOutput = document.getElementById("log-output");
        const spinner = document.getElementById("spinner");
        const canvasWrapper = document.getElementById("canvas-wrapper");

        // Sync FPS text
        fpsRange.addEventListener("input", (e) => {
            currentFps = parseInt(e.target.value);
            fpsVal.textContent = currentFps;
            addLog(`속도 변경: ${currentFps} FPS`);
        });

        // Add visual logs
        function addLog(msg) {
            logOutput.innerHTML = `[LOG] ${msg}<br>${logOutput.innerHTML}`;
        }

        // Change animation state (Idle, Walk, Happy, Hungry)
        function changeState(row, btn) {
            selectedStateRow = row;
            
            // Toggle active classes on buttons
            document.querySelectorAll(".btn-group .btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            addLog(`행(Row) 변경: ${row}행`);
            sliceSpritesheet();
        }

        // Slice current spritesheet texture based on row
        let baseTextureSource = null;
        let spritesheetWidth = 0;
        let spritesheetHeight = 0;

        function sliceSpritesheet() {
            if (!baseTextureSource) return;

            const cols = 4;
            const rows = 4;
            const frameWidth = spritesheetWidth / cols;
            const frameHeight = spritesheetHeight / rows;

            currentFrames = [];
            for (let i = 0; i < cols; i++) {
                try {
                    const texture = new PIXI.Texture({
                        source: baseTextureSource,
                        frame: new PIXI.Rectangle(i * frameWidth, selectedStateRow * frameHeight, frameWidth, frameHeight)
                    });
                    currentFrames.push(texture);
                } catch(e) {
                    console.error(e);
                }
            }

            addLog(`프레임 조각 완료 (${selectedStateRow}행, 각 프레임 크기: ${Math.round(frameWidth)}x${Math.round(frameHeight)})`);
        }

        // Chroma Key green screen removal helper
        function loadImageWithChromaKey(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = url;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        resolve(PIXI.Texture.from(img));
                        return;
                    }
                    ctx.drawImage(img, 0, 0);
                    const imgData = ctx.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        
                        // Green chromakey detection: green is dominant
                        if (g > r * 1.3 && g > b * 1.3 && g > 60) {
                            data[i+3] = 0; // Make transparent
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    
                    // Create texture from the keyed canvas
                    const texture = PIXI.Texture.from(canvas);
                    resolve(texture);
                };
                img.onerror = (e) => reject(e);
            });
        }

        // Initialize Pixi App and load asset
        async function loadMonsterAsset() {
            const id = monsterSelect.value;
            const bucketUrl = s3Input.value.trim();
            const spritesheetUrl = `${bucketUrl}/spritesheet/${id}-1.png`;

            // Reset UI
            spinner.style.display = "block";
            statusDisplay.className = "status-badge loading";
            statusDisplay.textContent = "S3 에셋 로딩 중...";
            addLog(`호출 주소: ${spritesheetUrl}`);

            // Reset current texture
            baseTextureSource = null;
            if (activeSprite) {
                activeSprite.visible = false;
            }

            try {
                // Load and key out green screen dynamically
                const texture = await loadImageWithChromaKey(spritesheetUrl);

                baseTextureSource = texture.source;
                spritesheetWidth = texture.width;
                spritesheetHeight = texture.height;

                addLog(`로드 및 크로마키 제거 완료! 해상도: ${texture.width}x${texture.height}`);
                sliceSpritesheet();

                if (!activeSprite) {
                    activeSprite = new PIXI.Sprite(currentFrames[0]);
                    activeSprite.anchor.set(0.5);
                    activeSprite.x = app.screen.width / 2;
                    activeSprite.y = app.screen.height / 2;
                    activeSprite.width = 110;
                    activeSprite.height = 110;
                    app.stage.addChild(activeSprite);
                }

                activeSprite.visible = true;
                spinner.style.display = "none";
                statusDisplay.className = "status-badge success";
                statusDisplay.textContent = "에셋 연결 성공 (200 OK)";

            } catch (err) {
                console.error(err);
                spinner.style.display = "none";
                statusDisplay.className = "status-badge error";
                statusDisplay.textContent = "연결 실패 (CORS 또는 파일 누락)";
                addLog(`[ERROR] S3에서 에셋을 로드하지 못했습니다. CORS 설정과 객체 공개 상태를 점검해 보세요.`);
            }
        }

        // Start app
        (async () => {
            app = new PIXI.Application();
            await app.init({
                width: 250,
                height: 250,
                backgroundAlpha: 0,
            });

            canvasWrapper.innerHTML = "";
            canvasWrapper.appendChild(app.canvas);
            canvasWrapper.appendChild(spinner);

            // App ticker loop for rendering frames
            let elapsed = 0;
            app.ticker.add((ticker) => {
                if (!baseTextureSource || currentFrames.length === 0 || !activeSprite) return;

                elapsed += ticker.deltaTime;
                animationElapsed += ticker.deltaTime;

                // Frame swap based on dynamic FPS speed
                // Pixi deltaTime is roughly 1/60s. So 60 / currentFps = frame interval
                const frameInterval = 60 / currentFps;
                const frameIndex = Math.floor(animationElapsed / frameInterval) % currentFrames.length;

                if (currentFrames[frameIndex]) {
                    activeSprite.texture = currentFrames[frameIndex];
                }

                // Smooth floating motion
                activeSprite.y = (app.screen.height / 2) + Math.sin(elapsed / 12.0) * 8;
            });

            // Initial Load
            await loadMonsterAsset();

            // Load on change
            monsterSelect.addEventListener("change", loadMonsterAsset);
            s3Input.addEventListener("change", loadMonsterAsset);
        })();
    </script>
</body>
</html>
