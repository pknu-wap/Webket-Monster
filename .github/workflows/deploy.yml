name: Webket-Monster CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  # 필요할 때 GitHub UI에서 수동으로 실행 가능하게 함
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. 백엔드 빌드 및 테스트 자동화 Job
  # ============================================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          cd backend
          chmod +x ./gradlew

      - name: Build and Test with Gradle
        run: |
          cd backend
          ./gradlew build -x test

      - name: Upload Backend Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webket-monster-backend-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  # ============================================================================
  # 2. 프론트엔드 크롬 익스텐션 패키징 Job
  # ============================================================================
  frontend-build:
    name: Frontend Build & Extension Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Plasmo Extension Zip
        run: |
          cd frontend
          npm run build:zip
        env:
          # GitHub Actions Secrets에 API 서버 주소를 등록하여 연동 가능
          # 등록되지 않은 경우 기본 Production URL이 사용됩니다.
          PLASMO_PUBLIC_API_URL: ${{ secrets.PLASMO_PUBLIC_API_URL || 'http://3.106.199.213:8080/api' }}

      - name: Upload Extension Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webket-monster-chrome-extension
          path: frontend/build/chrome-mv3-prod.zip
          retention-days: 14
